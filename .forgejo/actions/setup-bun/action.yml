name: Setup Bun workspace

description: Check out-independent Bun setup, cache, optional LFS pull, and install.

inputs:
  install-args:
    description: Arguments passed to bun install.
    required: false
    default: --frozen-lockfile
  lfs:
    description: Pull Git LFS files before installing dependencies.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Pull LFS files
      if: inputs.lfs == 'true'
      shell: bash
      run: |
        if ! command -v git-lfs >/dev/null 2>&1; then
          apt-get update
          apt-get install -y --no-install-recommends git-lfs
        fi
        git lfs install --force
        git lfs pull
        head -c 4 tests/fixtures/material3.fig | xxd

    - name: Install Bun
      shell: bash
      run: |
        set -euo pipefail
        PATH_FILE="${FORGEJO_PATH:-${GITHUB_PATH:-}}"
        test -n "$PATH_FILE" || {
          echo "Forgejo/GitHub PATH environment file missing" >&2
          exit 1
        }
        curl -fsSL https://bun.sh/install | bash -s -- bun-v1.3.14
        echo "$HOME/.bun/bin" >> "$PATH_FILE"
        "$HOME/.bun/bin/bun" --version

    - uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: bun install ${{ inputs.install-args }}
