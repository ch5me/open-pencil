name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.forgejo/workflows/api.yml'
  workflow_dispatch:

concurrency:
  group: api-deploy-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.forgejo/actions/setup-bun

      - name: Install API dependencies
        working-directory: api
        run: bun install --frozen-lockfile

      - name: API type generation
        working-directory: api
        run: bun run cf-typegen

      - name: Run API tests
        working-directory: api
        run: bun test
        env:
          OPENPENCIL_HOSTED_ENV: staging

      - name: Setup Hush (hush-in-CI)
        run: bash scripts/ci-setup-hush.sh wrangler-deploy-staging
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

      - name: Deploy API worker to staging
        id: deploy
        working-directory: api
        run: |
          set -eo pipefail
          hush run --target wrangler-deploy-staging -- bunx wrangler deploy --env staging 2>&1 | tee deploy.log
          url="$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)"
          echo "deployment-url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke test deployed Worker
        run: |
          set -e
          DEPLOY_URL="${{ steps.deploy.outputs.deployment-url }}"
          echo "Waiting for Worker to be routable..."
          for i in $(seq 1 10); do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "${DEPLOY_URL}/health" || true)
            if [ "$STATUS" = "200" ]; then
              echo "Worker health check passed at ${DEPLOY_URL}/health"
              curl -sf "${DEPLOY_URL}/health" | head -c 500
              exit 0
            fi
            echo "Attempt $i: status=$STATUS, retrying in 5s..."
            sleep 5
          done
          echo "Worker did not respond with 200 after 50s"
          exit 1

      - name: Run hosted proof against deployed Worker
        run: bun run proof:all
        env:
          OPENPENCIL_API_ORIGIN: ${{ steps.deploy.outputs.deployment-url }}
          OPENPENCIL_HOSTED_ENV: staging
