name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macos-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
          - platform: windows-latest
            target: aarch64-pc-windows-msvc
            label: windows-arm64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install dependencies (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: ./.forgejo/actions/setup-bun

      - name: Extract release notes
        id: changelog
        shell: bash
        run: |
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "release_notes<<$EOF" >> "$FORGEJO_OUTPUT"
          awk '/^## /{if(found)exit; found=1; next} found{print}' CHANGELOG.md >> "$FORGEJO_OUTPUT"
          echo "$EOF" >> "$FORGEJO_OUTPUT"

      - name: Add new contributors to release notes
        if: startsWith(forgejo.ref, 'refs/tags/v')
        id: release_body
        shell: bash
        env:
          RELEASE_NOTES: ${{ steps.changelog.outputs.release_notes }}
        run: |
          PREV_TAG=$(git tag -l 'v*' --sort=-version:refname | sed -n '2p')
          NEW=""
          if [ -n "$PREV_TAG" ]; then
            PREV=$(git log "$PREV_TAG" --format='%aE' | sort -u)
            NEW=$(comm -23 \
              <(git log "${PREV_TAG}..${{ forgejo.ref_name }}" --format='%aE' | sort -u) \
              <(echo "$PREV") \
            | while read -r email; do
                git log "${PREV_TAG}..${{ forgejo.ref_name }}" --format="%aE %aN" \
                  | grep "^${email} " | head -1 | sed 's/^[^ ]* //'
              done)
          fi

          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          {
            echo "body<<$EOF"
            printf '%s\n' "$RELEASE_NOTES"
            if [ -n "$NEW" ]; then
              echo ""
              echo "### New Contributors"
              echo ""
              echo "$NEW" | while read -r name; do echo "- $name"; done
            fi
            echo "$EOF"
          } >> "$FORGEJO_OUTPUT"

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tauriScript: bunx tauri
          args: --target ${{ matrix.target }}
          tagName: ${{ startsWith(forgejo.ref, 'refs/tags/v') && forgejo.ref_name || '' }}
          releaseName: ${{ startsWith(forgejo.ref, 'refs/tags/v') && format('OpenPencil {0}', forgejo.ref_name) || '' }}
          releaseBody: ${{ steps.release_body.outputs.body || steps.changelog.outputs.release_notes }}
          releaseDraft: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true

  publish-npm:
    if: startsWith(forgejo.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://npm.ch5.me/

      - uses: ./.forgejo/actions/setup-bun

      - name: Build packages for publish
        run: |
          for dir in packages/scene-graph packages/pen packages/kiwi packages/fig packages/core packages/dom-css packages/cli packages/mcp packages/vue; do
            if [ -f "$dir/package.json" ] && node -p "require('./$dir/package.json').scripts?.build" 2>/dev/null | grep -qv undefined; then
              echo "Building $dir..."
              (cd "$dir" && bun run build)
            fi
          done

      - name: Prepare publish directories
        run: bun tools/release-packages/src/prepare-publish-dirs.ts

      - name: Pack packages for publish
        run: bun tools/release-packages/src/cli.ts pack

      - name: Publish packages to npm
        run: bun tools/release-packages/src/cli.ts publish
