name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # CH5-local: the `macos-latest` and `windows-latest` legs moved to
        # `build-macos-windows.yml`, which is `workflow_dispatch`-only. No CH5
        # runner carries either label, so on git.ch5.me every `v*` tag push
        # created four job rows nothing could claim -- and because
        # `publish-npm` is `needs: build`, those stuck legs also blocked the
        # npm publish, which has never run once. `on:` is per-workflow and is
        # the only lever Forgejo honours server-side, so splitting the legs out
        # is the only way to stop them queuing without also stopping this leg.
        # Relabelling them was rejected: CH5 has no Windows capacity, and
        # pointing a job at a runner it was never written for reports green
        # for work it did not do. Full reasoning in build-macos-windows.yml.
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: https://github.com/Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: ${{ matrix.target }}

      # No `sudo`: the Forgejo runner executes this job as root inside
      # `node:24-bookworm`, which does not ship sudo at all, so a `sudo apt-get`
      # here dies with `sudo: command not found` rather than a permissions error.
      - name: Install dependencies (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          apt-get update
          apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: ./.forgejo/actions/setup-bun

      - name: Extract release notes
        id: changelog
        shell: bash
        run: |
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "release_notes<<$EOF" >> "$FORGEJO_OUTPUT"
          awk '/^## /{if(found)exit; found=1; next} found{print}' CHANGELOG.md >> "$FORGEJO_OUTPUT"
          echo "$EOF" >> "$FORGEJO_OUTPUT"

      - name: Add new contributors to release notes
        if: startsWith(forgejo.ref, 'refs/tags/v')
        id: release_body
        shell: bash
        env:
          RELEASE_NOTES: ${{ steps.changelog.outputs.release_notes }}
        run: |
          PREV_TAG=$(git tag -l 'v*' --sort=-version:refname | sed -n '2p')
          NEW=""
          if [ -n "$PREV_TAG" ]; then
            PREV=$(git log "$PREV_TAG" --format='%aE' | sort -u)
            NEW=$(comm -23 \
              <(git log "${PREV_TAG}..${{ forgejo.ref_name }}" --format='%aE' | sort -u) \
              <(echo "$PREV") \
            | while read -r email; do
                git log "${PREV_TAG}..${{ forgejo.ref_name }}" --format="%aE %aN" \
                  | grep "^${email} " | head -1 | sed 's/^[^ ]* //'
              done)
          fi

          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          {
            echo "body<<$EOF"
            printf '%s\n' "$RELEASE_NOTES"
            if [ -n "$NEW" ]; then
              echo ""
              echo "### New Contributors"
              echo ""
              echo "$NEW" | while read -r name; do echo "- $name"; done
            fi
            echo "$EOF"
          } >> "$FORGEJO_OUTPUT"

      - name: Build Tauri
        uses: https://github.com/tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tauriScript: bunx tauri
          args: --target ${{ matrix.target }}
          tagName: ${{ startsWith(forgejo.ref, 'refs/tags/v') && forgejo.ref_name || '' }}
          releaseName: ${{ startsWith(forgejo.ref, 'refs/tags/v') && format('OpenPencil {0}', forgejo.ref_name) || '' }}
          releaseBody: ${{ steps.release_body.outputs.body || steps.changelog.outputs.release_notes }}
          releaseDraft: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true

  publish-npm:
    if: startsWith(forgejo.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://npm.ch5.me/

      - uses: ./.forgejo/actions/setup-bun

      - name: Build packages for publish
        run: |
          for dir in packages/scene-graph packages/pen packages/kiwi packages/fig packages/core packages/dom-css packages/cli packages/mcp packages/vue; do
            if [ -f "$dir/package.json" ] && node -p "require('./$dir/package.json').scripts?.build" 2>/dev/null | grep -qv undefined; then
              echo "Building $dir..."
              (cd "$dir" && bun run build)
            fi
          done

      - name: Prepare publish directories
        run: bun tools/release-packages/src/prepare-publish-dirs.ts

      - name: Pack packages for publish
        run: bun tools/release-packages/src/cli.ts pack

      - name: Publish packages to npm
        run: bun tools/release-packages/src/cli.ts publish
