name: Heavy tests

on:
  workflow_dispatch:

concurrency:
  group: heavy-tests-${{ forgejo.ref }}
  cancel-in-progress: true

env:
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
  fig-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.forgejo/actions/setup-bun
        with:
          lfs: 'true'

      - name: Heavy fig roundtrip tests
        run: bun run test:unit:heavy
        env:
          BUN_HEAVY_TESTS: 'true'
