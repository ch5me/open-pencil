name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - 'packages/docs/**'
  workflow_dispatch:

env:
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.forgejo/actions/setup-bun

      - run: bun run --filter @open-pencil/docs build

      - name: Setup Hush (hush-in-CI)
        run: bash scripts/ci-setup-hush.sh wrangler-deploy-staging
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

      - name: Deploy docs to Cloudflare Pages
        run: hush run --target wrangler-deploy-staging -- bunx wrangler pages deploy packages/docs/.vitepress/dist --project-name=openpencil-docs
