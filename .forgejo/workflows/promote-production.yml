name: Promote to Production

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit SHA to promote (defaults to latest staging candidate)'
        required: false
        type: string

concurrency:
  group: app-promote-production
  cancel-in-progress: false

env:
  OPENPENCIL_HOSTED_ENV: production

jobs:
  promote-production:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: production
      url: https://design.elf.dance
    steps:
      - uses: actions/checkout@v4

      - uses: ./.forgejo/actions/setup-bun

      - name: Promote candidate to production
        run: bun run promote:production

      - name: Setup Hush (hush-in-CI)
        run: bash scripts/ci-setup-hush.sh wrangler-deploy-prod
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

      - name: Deploy production to Cloudflare Pages
        run: hush run --target wrangler-deploy-prod -- bunx wrangler pages deploy dist --project-name open-pencil --branch main

      - name: Smoke test production
        run: |
          sleep 5
          curl -sf https://design.elf.dance >/dev/null
