name: Deploy app

on:
  push:
    branches: [main]
    paths-ignore:
      - 'packages/docs/**'
      - 'openspec/**'
      - '*.md'
  workflow_dispatch:

concurrency:
  group: app-deploy-${{ forgejo.ref }}
  cancel-in-progress: true

env:
  OPENPENCIL_HOSTED_ENV: staging

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: staging
      url: https://staging.design.elf.dance
    steps:
      - uses: actions/checkout@v4

      - uses: ./.forgejo/actions/setup-bun

      - name: Install oxlint
        run: bun add -g oxlint

      - name: Format check
        run: bun run format:check

      - name: Build candidate
        run: bun run build:packages && ./node_modules/.bin/vite build

      - name: Record staging manifest
        run: bun run release:candidate

      - name: Setup Hush (hush-in-CI)
        run: bash scripts/ci-setup-hush.sh wrangler-deploy-staging
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

      - name: Deploy app to Cloudflare Pages
        run: hush run --target wrangler-deploy-staging -- bunx wrangler pages deploy dist --project-name open-pencil --branch main

      - name: Smoke test staging
        run: |
          sleep 5
          curl -sf https://staging.design.elf.dance >/dev/null

      - name: Upload manifest as artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-manifest
          path: .build-manifests/staging.json
          retention-days: 30
