name: Preview

on:
  pull_request_target:
    branches: [main]
    paths-ignore:
      - 'packages/docs/**'
      - 'openspec/**'
      - '*.md'

concurrency:
  group: preview-${{ forgejo.event.pull_request.number }}
  cancel-in-progress: true

env:
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ forgejo.event.pull_request.head.sha }}

      - uses: ./.forgejo/actions/setup-bun

      - name: Format check
        run: bun run format:check

      - run: bun run build

      - name: Setup Hush (hush-in-CI)
        run: bash scripts/ci-setup-hush.sh wrangler-deploy-staging
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

      - name: Deploy preview to Cloudflare Pages
        id: deploy
        run: |
          set -eo pipefail
          hush run --target wrangler-deploy-staging -- bunx wrangler pages deploy dist --project-name=openpencil-app --branch=${{ forgejo.event.pull_request.head.ref }} 2>&1 | tee deploy.log
          url="$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | head -1)"
          echo "deployment-url=$url" >> "$GITHUB_OUTPUT"

      - name: Report preview URL
        run: 'echo "Preview: ${{ steps.deploy.outputs.deployment-url }}"'

      - name: Validate preview deploy
        env:
          OPENPENCIL_PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "Waiting for Pages deploy to propagate..."
          DEPLOY_URL="${{ steps.deploy.outputs.deployment-url }}"
          for i in $(seq 1 15); do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "$DEPLOY_URL" || true)
            if [ "$STATUS" = "200" ]; then
              echo "Preview URL responding with 200"
              exit 0
            fi
            echo "Attempt $i: status=$STATUS, retrying in 3s..."
            sleep 3
          done
          echo "Preview URL did not respond with 200 after 45s"
          exit 1

      - name: Run preview proof (hosted auth + flag validation)
        run: bun run proof:preview
        env:
          OPENPENCIL_PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
          OPENPENCIL_PREVIEW_API_ORIGIN: ${{ vars.PREVIEW_API_ORIGIN || 'http://127.0.0.1:8787' }}
