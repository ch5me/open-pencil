# CH5-local file (not upstream's). It holds the `macos-latest` and
# `windows-latest` legs of the `build` matrix that used to live in
# `.forgejo/workflows/build.yml`, so they can carry an `on:` trigger of their
# own.
#
# WHY THEY ARE NOT IN build.yml ANY MORE
#
# No CH5 Forgejo runner carries `macos-latest` or `windows-latest` --
# ch5-macmini-runner carries `macos` / `macos-arm64` / `ios`, and CH5 has no
# Windows capacity at all -- so on git.ch5.me/ch5/open-pencil every `v*` tag
# push created four job rows no runner could ever claim. All 30 runs this
# workflow has ever had show those four legs at `task_id=0`, never started,
# every one ending `cancelled`. Worse, `publish-npm` is `needs: build`, so the
# four stuck legs also blocked the npm publish: it has never run once.
#
# `on:` is the only lever Forgejo honours server-side, and it is per-workflow,
# so separating these legs is the only way to stop them being scheduled
# without also stopping the `ubuntu-22.04` leg and `publish-npm`, which do run
# there.
#
# WHY NOT RELABEL THEM
#
# Relabelling is dishonest. Pointing a Windows cross-compile at `ubuntu-latest`
# would run something it was never meant to run and report green, and pointing
# the macOS legs at `macos-arm64` would wire two full Tauri builds onto the
# single ch5-macmini-runner that real iOS signing depends on. If a job cannot
# be served, the honest outcome is that it is not automatically triggered.
#
# The job below is a verbatim copy of the removed matrix legs and their steps;
# keep it that way so a future edit to build.yml can be mirrored mechanically.
name: Build (macOS, Windows)

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macos-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
          - platform: windows-latest
            target: aarch64-pc-windows-msvc
            label: windows-arm64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install dependencies (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: ./.forgejo/actions/setup-bun

      - name: Extract release notes
        id: changelog
        shell: bash
        run: |
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "release_notes<<$EOF" >> "$FORGEJO_OUTPUT"
          awk '/^## /{if(found)exit; found=1; next} found{print}' CHANGELOG.md >> "$FORGEJO_OUTPUT"
          echo "$EOF" >> "$FORGEJO_OUTPUT"

      - name: Add new contributors to release notes
        if: startsWith(forgejo.ref, 'refs/tags/v')
        id: release_body
        shell: bash
        env:
          RELEASE_NOTES: ${{ steps.changelog.outputs.release_notes }}
        run: |
          PREV_TAG=$(git tag -l 'v*' --sort=-version:refname | sed -n '2p')
          NEW=""
          if [ -n "$PREV_TAG" ]; then
            PREV=$(git log "$PREV_TAG" --format='%aE' | sort -u)
            NEW=$(comm -23 \
              <(git log "${PREV_TAG}..${{ forgejo.ref_name }}" --format='%aE' | sort -u) \
              <(echo "$PREV") \
            | while read -r email; do
                git log "${PREV_TAG}..${{ forgejo.ref_name }}" --format="%aE %aN" \
                  | grep "^${email} " | head -1 | sed 's/^[^ ]* //'
              done)
          fi

          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          {
            echo "body<<$EOF"
            printf '%s\n' "$RELEASE_NOTES"
            if [ -n "$NEW" ]; then
              echo ""
              echo "### New Contributors"
              echo ""
              echo "$NEW" | while read -r name; do echo "- $name"; done
            fi
            echo "$EOF"
          } >> "$FORGEJO_OUTPUT"

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tauriScript: bunx tauri
          args: --target ${{ matrix.target }}
          tagName: ${{ startsWith(forgejo.ref, 'refs/tags/v') && forgejo.ref_name || '' }}
          releaseName: ${{ startsWith(forgejo.ref, 'refs/tags/v') && format('OpenPencil {0}', forgejo.ref_name) || '' }}
          releaseBody: ${{ steps.release_body.outputs.body || steps.changelog.outputs.release_notes }}
          releaseDraft: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
