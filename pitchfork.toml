[settings.proxy]
enable = true

[daemons.app]
run = "./node_modules/.bin/vite --host 127.0.0.1 --port $PORT --strictPort"
dir = "."
port = 1420
ready_http = { url = "http://127.0.0.1:1420/", status = [200], timeout = "30s" }

[daemons.docs]
run = "./node_modules/.bin/vitepress dev . --host 127.0.0.1 --port $PORT --strictPort"
dir = "packages/docs"
port = 5173
ready_http = { url = "http://127.0.0.1:5173/", status = [200], timeout = "30s" }
