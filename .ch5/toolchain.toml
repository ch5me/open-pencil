schemaVersion = 1

[repo]
id = "open-pencil"
kind = "node-app"
packageManager = "bun"
lockfiles = ["bun.lock", "package.json", "api/bun.lock", "api/package.json"]

[[verify]]
name = "repository structure: package.json"
command = "test -f package.json"

[deps]
install = "hush run --target dependency-install -- bun install --frozen-lockfile && hush run --target dependency-install -- bun install --cwd api --frozen-lockfile"

[warm]
command = "hush run --target dependency-install -- bun install --frozen-lockfile && hush run --target dependency-install -- bun install --cwd api --frozen-lockfile"
